name: Vendor drift

# The vendored registry files are byte-pinned to a jerkai commit. This checks
# them out alongside and compares each vendored copy, header stripped, against
# `git show <locked-sha>:<path>` — the SHA in vendor.lock.json, not upstream
# `main`.
#
# What that guarantees: nobody has edited src/vendor/, and no unlocked file has
# appeared there. What it does not: the locked commit is immutable, so an
# upstream change to lib/dashboard can never make this job fail. The weekly
# schedule below re-runs the same comparison against the same frozen bytes and
# can only ever return the same result. A stale metric registry stays green.
# Picking up an upstream change is a deliberate step: re-copy both files, bump
# `sha` in vendor.lock.json, re-run the check.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  vendor-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: jerkai-mcp

      - name: Check out the upstream jerkai repo at full depth
        uses: actions/checkout@v5
        with:
          repository: albimartai/jerkai
          path: jerkai
          fetch-depth: 0
          # Needed only if albimartai/jerkai is private.
          token: ${{ secrets.JERKAI_REPO_TOKEN || github.token }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check vendored files against the locked commit
        working-directory: jerkai-mcp
        env:
          JERKAI_REPO: ${{ github.workspace }}/jerkai
        run: node scripts/check-vendor-drift.mjs
